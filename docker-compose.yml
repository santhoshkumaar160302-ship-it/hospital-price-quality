name: hospital-pq

x-airflow: &airflow
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: hospital-pq-airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-only
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    PYTHONPATH: /opt/airflow
    LANDING_DIR: /opt/airflow/landing
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: warehouse
    WAREHOUSE_USER: warehouse
    WAREHOUSE_PASSWORD: warehouse
    DBT_LOG_PATH: /tmp/dbt-logs
  volumes:
    - ./dags:/opt/airflow/dags
    - ./ingest:/opt/airflow/ingest
    - ./config:/opt/airflow/config
    - ./dbt:/opt/airflow/dbt
    - ./tests/fixtures:/opt/airflow/fixtures:ro
    - ./landing:/opt/airflow/landing   # downloaded CMS files, visible on your machine
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]   # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: version
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      <<: *airflow-depends
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  dashboard:
    build: ./app
    ports: ["8501:8501"]
    environment:
      WAREHOUSE_HOST: postgres
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
